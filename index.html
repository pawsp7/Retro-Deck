<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
    }
    .mechanical-bevel {
      box-shadow: 
        inset 1px 1px 1px rgba(255,255,255,0.1),
        inset -1px -1px 1px rgba(0,0,0,0.5),
        2px 2px 4px rgba(0,0,0,0.8);
    }
    .mechanical-inset {
      box-shadow: 
        inset 2px 2px 4px rgba(0,0,0,0.8),
        inset -1px -1px 1px rgba(255,255,255,0.05);
    }
    .amber-glow {
      text-shadow: 0 0 8px rgba(255, 181, 153, 0.6);
    }
    .brushed-metal {
      background-image: repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(255,255,255,0.02) 1px, rgba(255,255,255,0.02) 2px);
    }
    .tape-reel-spin {
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vu-needle {
      transition: transform 0.1s ease-out;
      transform-origin: bottom center;
    }
    .screw-head::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 1px;
      background: rgba(0,0,0,0.6);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
    }
  </style>

<script>
    // Simple VU Needle Simulation
    const needles = document.querySelectorAll('.vu-needle');
    function updateNeedles() {
      needles.forEach(needle => {
        const randomRotation = -20 + Math.random() * 40;
        needle.style.transform = `rotate(${randomRotation}deg)`;
      });
      requestAnimationFrame(updateNeedles);
    }
    updateNeedles();

    // Transport button interaction log
    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        console.log('Component Interaction Triggered');
      });
    });
